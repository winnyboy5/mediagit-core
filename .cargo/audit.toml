# cargo-audit configuration
# https://rustsec.org/

[advisories]

# ── Advisories with no upstream fix available ───────────────────────────
#
# RUSTSEC-2023-0071: rsa 0.9.10 — Marvin Attack (medium severity)
#   jsonwebtoken 10.3 → rsa 0.9.10
#   The rsa crate has NO fixed version available. Our code only uses
#   HMAC-SHA256 (Algorithm::HS256) with secret keys — RSA functionality
#   is never invoked. The `auth` feature (and therefore jsonwebtoken)
#   is optional in mediagit-security.
#
# RUSTSEC-2023-0089: atomic-polyfill 1.0.3 (unmaintained)
#   postcard 1.1.3 → heapless 0.7 → atomic-polyfill
#   postcard 1.1.3 is the latest release. atomic-polyfill is a no-op on
#   desktop targets (only relevant for embedded/no_std).
#
# RUSTSEC-2024-0384: instant 0.1.13 (unmaintained)
#   azure_core 0.21 → futures-lite 1.x → fastrand 1.x → instant
#   azure_storage_blobs 0.21 is the latest on crates.io and requires
#   azure_core 0.21. The azure feature is optional in mediagit-storage.
#
# RUSTSEC-2024-0436: paste 1.0.15 (unmaintained)
#   azure_core 0.21 → paste. Same root cause as RUSTSEC-2024-0384.
#
# RUSTSEC-2026-0098, -0099, -0104: rustls-webpki 0.101.7 — RESOLVED 2026-07-23.
#   The legacy rustls 0.21 stack entered via aws-config's `rustls` feature
#   (→ aws-smithy-runtime `default-https-client` → `rustls-aws-lc`). We never
#   used that client — every S3 config and the credentials chain is handed
#   `http_pool::shared()` — so the feature was dropped. rustls 0.21 and
#   rustls-webpki 0.101.7 are no longer in the tree; only 0.103.13 remains.
#   Ignores removed.
#
# RUSTSEC-2026-0097: rand 0.7.3 and 0.8.5 (unsound warning)
#   rand 0.7.3 ← http-types ← azure_core 0.21 (transitive, optional azure feature)
#   rand 0.8.5 ← jsonwebtoken / azure_core 0.21 (transitive, optional)
#   The unsoundness requires a custom global logger calling rand::rng() —
#   MediaGit uses tracing (not log) and never calls rand::rng() directly.
#   Updated rand 0.9→0.9.4 and 0.10→0.10.1 (our direct deps).
#
# RUSTSEC-2026-0194, -0195: quick-xml 0.31.0 (DoS via duplicate attributes / namespace alloc)
#   azure_core 0.21 → quick-xml 0.31.0. The Azure SDK for Rust hasn't
#   released a version that uses quick-xml >= 0.41. The azure feature is
#   optional in mediagit-storage and XML parsing is only used for Azure
#   Blob Storage responses — not attacker-controlled input.
#
# RUSTSEC-2026-0174: http-types 2.12.0 (notice — ASCII invariant violation)
#   azure_core 0.21 → http-types 2.12.0. Same root cause as quick-xml:
#   pinned by the Azure SDK. Low severity notice, not an exploitable vuln.
#
# RUSTSEC-2026-0183, -0184: git2 0.20.4 (unsound — UB in Remote::list / BlameHunk)
#   No patched git2 release available. Our code does not call Remote::list()
#   or create BlameHunks from buffers, so these code paths are not reachable.
#
# Review date: 2026-07-18
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2023-0089",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0174",
    "RUSTSEC-2026-0183",
    "RUSTSEC-2026-0184",
]
