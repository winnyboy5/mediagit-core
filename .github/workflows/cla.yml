name: CLA

# Gates outside pull requests on agreement to CLA.md.
#
# This is load-bearing, not ceremony. MediaGit is offered under BUSL-1.1 AND a
# commercial licence, which is only possible while one party holds the rights to
# all of the code. A single merged PR from someone who has not signed leaves that
# contributor holding copyright in their patch, and the commercial licence becomes
# unsellable for the file they touched — permanently, and with no way to undo it
# short of rewriting their code from scratch.
#
# Signatures are stored in this repo at .github/cla-signatures.json, so there is
# no third-party service holding the record.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'I have read the CLA and I hereby sign it.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/winnyboy5/mediagit-core/blob/main/CLA.md'
          branch: 'main'
          allowlist: winnyboy5,bot*
          custom-notsigned-prcomment: |
            Thanks for the contribution.

            Before this can be merged we need you to agree to the
            [Contributor License Agreement](https://github.com/winnyboy5/mediagit-core/blob/main/CLA.md).
            It is short, and it does **not** take your copyright away — you keep it.

            It exists because MediaGit is offered under both BUSL-1.1 and a
            commercial licence, and that is only legally possible while one party
            holds the rights to all the code.

            To sign, comment on this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA and I hereby sign it.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
