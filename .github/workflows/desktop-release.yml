name: Desktop Release

# Separate from release.yml (tags v*.*.*, CLI/server archives): the desktop app
# ships on its own `desktop-v*` tags as unsigned bundles for three OSes
# (deb + AppImage, dmg, NSIS). workflow_dispatch builds and uploads artifacts
# only; the GitHub release is created for tag pushes.

permissions:
  contents: read

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bundles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb appimage
            bundle-glob: target/release/bundle/*/*
          - os: macos-latest
            bundles: dmg
            bundle-glob: target/release/bundle/dmg/*.dmg
          - os: windows-2022
            bundles: nsis
            bundle-glob: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # Tauri sidecar naming: binaries/<name>-<host-triple>[.exe]. The bundler
      # installs them beside the app as plain `mediagit` / `mediagit-server`,
      # which is where engine.rs (Engine::locate) looks.
      - name: Build sidecars
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cargo build --locked --release -p mediagit-cli --bin mediagit
          cargo build --locked --release -p mediagit-server --bin mediagit-server
          mkdir -p crates/mediagit-desktop/binaries
          for b in mediagit mediagit-server; do
            cp "target/release/$b$EXT" "crates/mediagit-desktop/binaries/$b-$TRIPLE$EXT"
          done

      # Code signing is deferred (no certificate decision yet). When one exists,
      # add the signing config to tauri.conf.json and pass certificates through
      # repository secrets here; do not invent them in this file. The updater
      # key (TAURI_SIGNING_PRIVATE_KEY) is likewise unused.
      # beforeBuildCommand in tauri.conf.json runs `pnpm build` for the UI.
      - name: Build bundles
        shell: bash
        working-directory: crates/mediagit-desktop
        run: ../../ui/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }} --config tauri.bundle.conf.json

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mediagit-desktop-${{ matrix.os }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mediagit-desktop-*
          path: bundles

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MediaGit Desktop ${{ github.ref_name }}
          files: bundles/**/*
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
