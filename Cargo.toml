[workspace]
members = [
    "crates/mediagit-cli",
    "crates/mediagit-storage",
    "crates/mediagit-versioning",
    "crates/mediagit-compression",
    "crates/mediagit-media",
    "crates/mediagit-config",
    "crates/mediagit-observability",
    "crates/mediagit-security",
    "crates/mediagit-metrics",
    "crates/mediagit-protocol",
    "crates/mediagit-server",
    "crates/mediagit-test-utils",
]
resolver = "2"

[workspace.package]
version = "0.3.0-rc.3"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0"
authors = ["MediaGit Contributors"]
repository = "https://github.com/winnyboy5/mediagit-core"
homepage = "https://mediagit.dev"
documentation = "https://winnyboy5.github.io/mediagit-core"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1.83"

# CLI Framework
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
toml = { version = "1.0", features = ["preserve_order"] }
postcard = { version = "1.1", features = ["alloc"] }

# Error Handling
anyhow = "1.0.95"
thiserror = "2.0.9"

# Hashing
sha2 = "0.11"
blake3 = { version = "1.5", features = ["rayon"] }
hex = "0.4"

# Compression
zstd = "0.13"
brotli = "8.0"
flate2 = "1.0"

# Parallelization
rayon = "1.10"

# Observability
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "fmt", "ansi", "time"] }
# Updated to 0.14+ to fix RUSTSEC-2024-0437 (protobuf recursion)
prometheus = "0.14"

# Testing
tokio-test = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.10"
tempfile = "3"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# AWS SDK (ring crypto backend, to avoid aws-lc-sys build issues on Windows).
# Ring is selected consistently across the workspace: aws-smithy-http-client
# uses `rustls-ring`, rustls is pulled with default-features = false (its
# defaults include aws-lc-rs), and reqwest uses `rustls-no-provider` with each
# binary installing ring as the process default. One vendor edge remains
# outside our control: google-cloud-auth's `default-rustls-provider` default
# feature links aws-lc-rs, so aws-lc-sys is still built when the `gcs` feature
# is on.
# rt-tokio feature provides tokio sleep implementation for async operations
# No `rustls` feature: it pulls aws-smithy-http-client's `rustls-aws-lc`, and
# there is no ring variant exposed. We never use the SDK's built-in HTTPS
# client anyway — every S3 config and the credentials chain are handed
# `http_pool::shared()`, which builds a ring-backed client explicitly.
aws-config = { version = "1.10", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1.139", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }

# HTTP Client
# `rustls-no-provider` rather than `rustls`: 0.13's `rustls` feature hard-wires
# aws-lc-rs as the crypto provider. no-provider defers the choice to the
# process-level default, which every binary installs as ring (see the
# install_default() call in each main.rs). `query` became opt-in in 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2", "query"] }
bytes = "1"

# HTTP Framework
axum = "0.8"

# Progress & UI
indicatif = { version = "0.18", features = ["rayon", "futures"] }
console = "0.16"

[workspace.lints.rust]
# `forbid`: crates inheriting this table (mediagit-security, mediagit-config,
# mediagit-compression) are unsafe-free. Edition-2024 made env::set_var/remove_var
# unsafe; test-only env mutation for these crates routes through
# mediagit-test-utils::{set_var,remove_var}, which contains the unsafe.
unsafe_code = "forbid"
unused_must_use = "deny"
unused_imports = "deny"
dead_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
clone_on_ref_ptr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"

# ── Development profile ──────────────────────────────────────────────
# Optimised for fast compile + low linker RAM on ≤16 GB machines.
[profile.dev]
debug = "line-tables-only"       # Minimal debug info → 5-10× smaller, faster link
split-debuginfo = "unpacked"     # Write .dwo/.pdb per CU instead of one huge blob
incremental = true               # Default, but explicit for documentation

[profile.dev.build-override]
opt-level = 0                    # Don't waste time optimising proc-macros / build scripts

# ── Test profile ─────────────────────────────────────────────────────
[profile.test]
inherits = "dev"
opt-level = 1                    # Slight optimisation so tests *run* faster; minor build cost

# ── Release profile ─────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"                # Strip debug symbols from release binary → smaller output

# Optimized distribution profile (used by cargo-dist)
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration for automated releases
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Additional installers configuration
[workspace.metadata.dist.dependencies.apt]
# System dependencies for Linux builds
cmake = '*'
pkg-config = '*'
libssl-dev = '*'

# GitHub release configuration
[workspace.metadata.dist.github-release]
# Publish prereleases to GitHub
publish-prereleases = false
# Create GitHub releases
create = true

[workspace.metadata.cargo-machete]
ignored = ["husky-rs"]