gui = "AdvancedView"

[cmd."version"]
gui = "SettingsView"

[cmd."completions"]
excluded = "shell completions are a terminal feature"

[arg."completions SHELL"]
excluded = "shell completions are a terminal feature"

[cmd."__cli-tree"]
excluded = "hidden helper that prints the clap tree for the parity test"

[cmd."auth admin disable-user"]
gui = "SecurityView"

[arg."auth admin disable-user USER"]
