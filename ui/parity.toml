[arg."auth admin disable-user --server"]
gui = "ServerView"

[arg."auth admin disable-user --yes"]
gui = "ServerView"

[cmd."auth admin enable-user"]
gui = "SecurityView"

[arg."auth admin enable-user USER"]
gui = "ServerView"

[arg."auth admin enable-user --server"]
gui = "ServerView"

[cmd."remote ls-tree"]
gui = "RemoteView"

[arg."remote ls-tree REMOTE"]
gui = "RemoteView"

[arg."remote ls-tree PATH"]
gui = "RemoteView"

[arg."remote ls-tree --ref"]
gui = "RemoteView"

[cmd."auth admin list-grants"]
gui = "SecurityView"

[arg."auth admin list-grants USER"]
gui = "ServerView"

[arg."auth admin list-grants --server"]
gui = "ServerView"

[cmd."auth admin repo-access"]
gui = "SecurityView"

[arg."auth admin repo-access REPO"]
gui = "ServerView"

[arg."auth admin repo-access --server"]
gui = "ServerView"

[cmd."remote repos"]
gui = "RemoteView"

[cmd."remote repos list"]
gui = "RemoteView"

[arg."remote repos list --remote"]
