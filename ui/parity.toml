# GUI parity contract. crates/mediagit-cli/tests/parity_contract_test.rs fails on any CLI
# command or argument missing here, and on any entry here the CLI no longer has.
#
# [cmd."<path>"]       gui = "<View>"            where the command is surfaced
# [arg."<path> <arg>"] gui = "<View>[/part]"     where the argument is surfaced
#                      gui = "TODO:<View>"       not exposed yet (counted by the test)
#                      excluded = "<reason>"     deliberately never in the GUI
# Global flags are keyed without a command path: [arg."--machine"].
# Positionals are keyed by their help name: [arg."push REMOTE"].

# ---- global flags ----
[arg."--color"]
excluded = "--machine disables colour"

[arg."--log-format"]
excluded = "diagnostic log rendering for terminals; the GUI uses --machine"

[arg."--machine"]
excluded = "the engine always passes it; it is the transport, not a feature"

[arg."--quiet"]
excluded = "the GUI drives output through --machine, which is already silent"

[arg."--repository"]
excluded = "the engine sets the working directory (-C) for every call"

[arg."--secret-stdin"]
excluded = "the engine passes it whenever a secret is entered; it is the transport, not a feature"

[arg."--verbose"]
excluded = "the GUI has no terminal log to make verbose"

