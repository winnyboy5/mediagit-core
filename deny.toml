# cargo-deny configuration (OP-10).
#
# `cargo audit` already runs in CI, but it only answers "does a dependency have
# a published advisory". It says nothing about the three failure modes that
# actually bite a project shipping under BUSL-1.1 with seven cloud SDKs:
#
#   licenses — a copyleft-incompatible or unlicensed crate arriving through a
#              transitive bump, which is a legal problem discovered at release;
#   bans     — the duplicate-version drift this repo has already been bitten by
#              (aws-config's `rustls` feature pulled aws-lc *and* a second,
#              vulnerable rustls 0.21 alongside the intended one);
#   sources  — a dependency silently served from somewhere other than crates.io.
#
# Advisories stay authoritative in `.cargo/audit.toml`; this file defers to it
# rather than maintaining a second ignore list that would drift out of step.

[graph]
all-features = true

[licenses]
# Every license present in the current graph, verified with `cargo metadata`:
# no dependency ships without a license field.
#
# Our OWN crates are no longer listed here. They are `publish = false`, and
# `private.ignore` below makes cargo-deny skip unpublished workspace members
# entirely -- so the workspace licence never has to appear in a THIRD-PARTY
# allowlist again. Before this, `AGPL-3.0` sat in the allow list purely to
# stop cargo-deny failing on our own code, which made the list lie about what
# we accept from dependencies.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

# Skip our own workspace crates. They are BUSL-1.1, which is deliberately NOT in
# the allow list above -- that list is about what we accept FROM dependencies,
# and we do not want to accidentally admit a third-party BUSL crate just because
# we ship one ourselves.
private = { ignore = true }

[bans]
# Duplicate major versions are a warning, not an error: a graph this size
# always has some, and failing on them would mean pinning transitive deps we do
# not control. The *specific* duplicates that caused real harm are denied
# outright below.
multiple-versions = "warn"
wildcards = "deny"
# ...but a path dependency on one of our OWN workspace crates is not what that
# rule is for. `mediagit-config = { path = "../mediagit-config" }` carries no
# version, so cargo-deny counts it as a wildcard — 24 of them across the
# workspace, which is the entire reason the Dependency Policy job was red.
#
# The rule still does its real job: a wildcard on an EXTERNAL crate (`foo = "*"`)
# is still denied, and that is the case that actually lets an unreviewed upgrade
# in.
#
# The alternative — writing `version = "0.3.0-rc.4"` beside all 24 paths — buys
# nothing today: crates.io publishing is disabled (`release.yml:347`). It would
# also make every version bump a 24-line edit. If publishing is ever turned back
# on, `cargo publish` will refuse a path dep with no version, and THAT is the
# moment to add them.
allow-wildcard-paths = true

deny = [
    # rustls 0.21 arrived transitively alongside the intended 0.23 and brought
    # three webpki advisories with it. One TLS stack, one version.
    { name = "rustls", version = "<0.23" },
    # Two crypto providers in one binary means the one actually used is decided
    # by feature unification, not by us. See [[project-ring-tls-consistency]].
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    # OpenSSL is not a dependency this project wants: it reintroduces a system
    # library dependency the pure-Rust stack exists to avoid.
    #
    # Enforceable as of the DC-2 deletion: openssl-sys used to enter through
    # git2's `vendored-openssl` inside `mediagit-git`, which also carried the
    # only two advisories `.cargo/audit.toml` had to ignore. Deleting that one
    # dead crate cleared all three. This ban is what keeps it out.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Owned by `.cargo/audit.toml`, which carries the reasoning for each accepted
# advisory. Duplicating that list here would guarantee the two disagree.
yanked = "deny"
ignore = []
