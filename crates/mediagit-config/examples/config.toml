# MediaGit — per-repository `.mediagit/config.toml`
#
# This is the CLIENT's per-repo config. The server never loads it; server
# settings live in `mediagit-server.toml` (see CONFIGURATION.md Part 2).
#
# Every key below is real and has a read site. That is not a given: until
# 2026-09-18 this file also advertised `[app]`, `[observability]`,
# `[security]`, `[performance.cache]` and a `[compression]` block with zstd and
# brotli levels. None of them were ever read, and `[compression]` had never
# existed on the schema at all — compression is automatic and not configurable.
#
# Unknown keys are now REJECTED rather than ignored, so this file is also a
# test fixture: `the_shipped_example_config_parses` loads it. If a key here
# stops being real, that test fails.

# Written once by `mediagit init` / `clone`. Not meant to be hand-edited.
cdc_seed = 4891203847502938471
repo_namespace = "my-project"
layout_version = 2
repo_id = "a1b2c3d4e5f60718"
config_version = 4

# ---------------------------------------------------------------------------
# Storage backend. Exactly one [storage] block; all fields for the selected
# backend go directly in it.
# ---------------------------------------------------------------------------

[storage]
backend = "filesystem"
base_path = "./.mediagit/objects"
create_dirs = true
sync = false
file_permissions = "0644"

# AWS S3, or any S3-compatible service (MinIO, B2, DigitalOcean Spaces).
# Credentials are config-file-only — there is no environment-variable override.
#
# [storage]
# backend = "s3"
# bucket = "mediagit-bucket"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."
# endpoint = "https://minio.example.com"   # omit for real AWS
# prefix = "repos/my-project"

# Azure Blob Storage. `auth` is a tagged block (config_version 3+): one of
# account_key, connection_string, sas, or emulator.
#
# [storage]
# backend = "azure"
# container = "media"
# prefix = "repos/my-project"
# auth = { type = "account_key", account_name = "...", account_key = "..." }

# Google Cloud Storage.
#
# [storage]
# backend = "gcs"
# bucket = "mediagit-bucket"
# project_id = "my-project"
# credentials_path = "/path/to/service-account.json"
# prefix = "repos/my-project"

# ---------------------------------------------------------------------------
# Performance. Three keys, all optional. Each falls back to an environment
# variable and then to an internal default, which is why an empty
# [performance] is what `mediagit init` actually writes.
# ---------------------------------------------------------------------------

[performance]
upload_concurrency = 32     # else MEDIAGIT_UPLOAD_CONCURRENCY, else 32
download_concurrency = 24   # else MEDIAGIT_DOWNLOAD_CONCURRENCY, else 24
pack_workers = 8            # else MEDIAGIT_PACK_WORKERS, else 8

# ---------------------------------------------------------------------------
# Identity, remotes, branches
# ---------------------------------------------------------------------------

[author]
name = "Alice Smith"
email = "alice@example.com"

[remotes.origin]
url = "http://media-server.example.com/my-project"
# token   = "..."   # plaintext; MEDIAGIT_TOKEN and the OS keychain rank higher
# api_key = "..."   # only one of token/api_key per remote; token wins

[branches.main]
remote = "origin"
merge = "refs/heads/main"

[protected_branches.main]
prevent_force_push = true
prevent_deletion = true
require_reviews = false
min_approvals = 1

# ---------------------------------------------------------------------------
# Your own keys. MediaGit never interprets anything here — and, unlike the
# sections removed in config_version 4, never pretended to. This is the only
# place a key the schema does not define is accepted.
# ---------------------------------------------------------------------------

[custom]
# studio_pipeline_id = "vfx-42"
