[package]
name = "mediagit-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Configuration management system for MediaGit Core"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[dependencies]
# Serialization and Config
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = { workspace = true }
serde_yaml = "0.9"

# Error Handling
anyhow.workspace = true
thiserror.workspace = true

# Async Runtime
tokio = { workspace = true, features = ["fs", "io-util"] }

# Observability
tracing.workspace = true

# Utilities

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
mediagit-test-utils = { path = "../mediagit-test-utils" }

[lints]
workspace = true
