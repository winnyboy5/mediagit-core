[package]
name = "mediagit-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Authentication, encryption, and audit trail"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[dependencies]
# Encryption
aes-gcm = "0.10"
# Raw AES-256 block cipher, for the XAES-256-GCM key/nonce derivation
# (envelope v2) — NOT a new crypto primitive, it's the same block cipher
# aes-gcm 0.10 already pulls in at this exact version; used directly rather
# than adding a dependency on the (unmaintained) `xaes-256-gcm` crate.
aes = "0.8"

# Key derivation
argon2 = { version = "0.5", features = ["std"] }

# Secret handling and memory security
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }

# Random number generation
rand = "0.10"  # kept for auth/apikey.rs; encryption.rs nonces/keys use getrandom (fork-safe)
getrandom = "0.4"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Async runtime
tokio.workspace = true

# Observability
tracing.workspace = true

# Utilities
hex = { workspace = true, features = ["serde"] }
sha2.workspace = true
chrono.workspace = true
# EncryptionKey::derive_subkey's domain separation (already a workspace dep,
# used at this same pinned version by mediagit-cli et al.)
blake3.workspace = true

# Authentication (optional)
jsonwebtoken = { version = "10.3", features = ["rust_crypto"], optional = true }
bcrypt = { version = "0.19.2", optional = true }
uuid = { version = "1.10", features = ["v4", "serde"], optional = true }

# HTTP/Web framework (for middleware)
axum = { workspace = true, optional = true }
http = { version = "1.0", optional = true }

# TLS/Certificate management (optional)
rcgen = { version = "0.14", features = ["pem"], optional = true }
time = { version = "0.3", features = ["macros"], optional = true }
ssh-key = { version = "0.6.7", features = ["ed25519"] }

[features]
default = []
auth = ["jsonwebtoken", "bcrypt", "uuid"]
database = []
middleware = ["axum", "http"]
tls = ["rcgen", "time"]
all = ["auth", "database", "middleware", "tls"]

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
mediagit-test-utils = { path = "../mediagit-test-utils" }

[[bench]]
name = "encryption_benchmark"
harness = false

[lints]
workspace = true
