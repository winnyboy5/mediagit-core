[package]
name = "mediagit-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Media metadata extraction and merge strategies"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[dependencies]
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Image processing and metadata
# Migrated from img_hash 3.2 to image-hasher 1 (maintained fork) to fix:
# - RUSTSEC-2023-0080: transpose 0.1.0 buffer overflow vulnerability
# - RUSTSEC-2025-0056: adler 1.0.2 unmaintained
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
kamadak-exif = "0.6"
image_hasher = "3"

# Video processing
mp4parse = "0.17"

# Audio processing
symphonia = { version = "0.5", features = ["all"] }

# PSD parsing
psd = "0.3.5"

# Serialization for metadata
serde_json.workspace = true

# Regex for metadata parsing
regex-lite = "0.1"

# Compressed .blend header peek (Blender <3.0 gzip, >=3.0 zstd)
flate2.workspace = true
zstd.workspace = true

[package.metadata.cargo-machete]
ignored = ["kamadak-exif"]  # used via `exif::` re-export

[dev-dependencies]
