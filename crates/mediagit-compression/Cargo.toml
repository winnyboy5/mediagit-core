[package]
name = "mediagit-compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Content-aware compression engine for media objects"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[dependencies]
tokio = { workspace = true, features = ["rt"] }
zstd.workspace = true
brotli.workspace = true
flate2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
mediagit-security = { version = "0.3.0-rc.4", path = "../mediagit-security", default-features = false }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "compression_bench"
harness = false

[lints]
workspace = true
