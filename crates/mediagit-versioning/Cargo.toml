[package]
name = "mediagit-versioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Core VCS engine: ODB, refs, commits, trees, and packs"

[lib]
# Doctest compilation OOMs at jobs=2 on ≤16 GB RAM (each doctest binary
# requires full LLVM codegen of this crate + blake3 + fastcdc + storage).
# Code examples in doc comments still serve as documentation; actual coverage
# is provided by unit tests and integration tests.
doctest = false

[dependencies]
mediagit-storage = { path = "../mediagit-storage" }
mediagit-compression = { path = "../mediagit-compression" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
blake3.workspace = true
hex.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
toml.workspace = true
moka = { version = "0.12.14", features = ["future"] }
uuid = { version = "1.11", features = ["v4"] }
fastcdc = "4.0"
memmap2 = "0.9"
num_cpus = "1.16"
async-channel = "2.3"
zstd.workspace = true
tempfile = "3.13"
roaring = "0.11.4"
ignore = "0.4"  # gitignore-style pattern matching, reused for sparse-checkout pattern mode

[dev-dependencies]
proptest.workspace = true
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
uuid = { version = "1.11", features = ["v4"] }
async-trait.workspace = true

[[bench]]
name = "pack_benchmark"
harness = false

[[bench]]
name = "odb_bench"
harness = false

[[bench]]
name = "branch_bench"
harness = false

[[bench]]
name = "merge_bench"
harness = false

[[bench]]
name = "chunking_bench"
harness = false

[[example]]
name = "dedup_report"

[lints.rust]
unsafe_code = "deny"
