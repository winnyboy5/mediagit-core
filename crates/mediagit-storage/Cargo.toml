[package]
name = "mediagit-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Unified async storage backend trait and implementations"

[features]
azure = ["dep:azure_storage", "dep:azure_storage_blobs", "dep:azure_core", "dep:time"]
gcs = ["dep:google-cloud-storage", "dep:google-cloud-auth", "dep:google-cloud-gax", "dep:http", "dep:serde_json"]
all = ["azure", "gcs"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
bytes = "1.7"
memmap2 = "0.9"
futures = "0.3"
getrandom = "0.4"  # OS RNG for per-repo repo_id generation (namespace-collision guard)

azure_storage_blobs = { version = "0.21", optional = true }
azure_storage = { version = "0.21", optional = true }
azure_core = { version = "0.21", optional = true }
time = { version = "0.3", optional = true }
# default-features = false on both: their shared `default-rustls-provider`
# default feature links aws-lc-rs (and thus aws-lc-sys, with its cmake/NASM
# build on Windows). The workspace standardises on ring, installed as the
# process-level provider in each binary's main(). Dropping the default also
# drops `default-idtoken-backend`, which we do not use -- GCS auth here is
# OAuth access tokens via ADC / service-account JSON, not ID tokens.
google-cloud-storage = { version = "1.16", optional = true, default-features = false }
google-cloud-auth = { version = "1.14", optional = true, default-features = false }
# Direct dep for typed access to RPC error codes (Code::NotFound), needed
# because google-cloud-storage's control plane is gRPC and HTTP-status-based
# is_not_found checks miss those errors.
google-cloud-gax = { version = "1.12", optional = true }
http = { version = "1", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }

[[test]]
name = "azure_azurite_tests"
required-features = ["azure"]

[[test]]
name = "gcs_emulator_tests"
required-features = ["gcs"]

[[test]]
name = "gcs_integration_tests"
required-features = ["gcs"]

[[bench]]
name = "cache_bench"
harness = false

[package.metadata.cargo-machete]
ignored = []

[lints.rust]
unsafe_code = "deny"
