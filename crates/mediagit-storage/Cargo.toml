[package]
name = "mediagit-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Unified async storage backend trait and implementations"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[features]
azure = ["dep:opendal", "dep:reqsign-azure-storage", "dep:reqsign-core", "dep:http", "dep:reqwest", "dep:rustls"]
gcs = ["dep:google-cloud-storage", "dep:google-cloud-auth", "dep:google-cloud-gax", "dep:http", "dep:serde_json", "dep:reqwest"]
all = ["azure", "gcs"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
bytes = "1.7"
memmap2 = "0.9"
futures = "0.3"
getrandom = "0.4"  # OS RNG for per-repo repo_id generation (namespace-collision guard)

# default-features = false on both: their shared `default-rustls-provider`
# default feature links aws-lc-rs (and thus aws-lc-sys, with its cmake/NASM
# build on Windows). The workspace standardises on ring, installed as the
# process-level provider in each binary's main(). Dropping the default also
# drops `default-idtoken-backend`, which we do not use -- GCS auth here is
# OAuth access tokens via ADC / service-account JSON, not ID tokens.
google-cloud-storage = { version = "1.16", optional = true, default-features = false }
google-cloud-auth = { version = "1.14", optional = true, default-features = false }
# Direct dep for typed access to RPC error codes (Code::NotFound), needed
# because google-cloud-storage's control plane is gRPC and HTTP-status-based
# is_not_found checks miss those errors.
google-cloud-gax = { version = "1.12", optional = true }
http = { version = "1", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }

# OpenDAL replaces the EOL azure_storage_blobs 0.21 stack. Do NOT enable
# `reqwest-rustls-tls` (OpenDAL's default): it turns on reqwest's `rustls`
# feature, which hard-wires aws-lc-rs (`__rustls-aws-lc-rs`). This workspace
# has zero aws-lc and standardises on ring -- `reqwest-rustls-no-provider-tls`
# is the ring-compatible variant (see mediagit_protocol::ensure_crypto_provider).
# Signing for the container-create REST call: OpenDAL is data-plane only.
# Same signer OpenDAL uses internally, so we do not hand-roll Shared Key.
# Unauthenticated/simple HTTP for the signed container-create call.
reqwest = { workspace = true, optional = true }
# Upload attestation: fold per-part CRC64NVME digests into the assembled
# object's checksum, which the server supplies at CompleteMultipartUpload.
# Already in the tree via aws-sdk-s3 -> aws-smithy-checksums at these versions.
crc-fast = "1.10"
base64 = "0.22"
reqsign-azure-storage = { version = "3.1", optional = true }
reqsign-core = { version = "3.1", optional = true }
# Provider install for the reqwest rustls-no-provider policy (see azure.rs).
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
opendal = { version = "0.57", optional = true, default-features = false, features = ["services-azblob", "reqwest-rustls-no-provider-tls", "layers-retry", "layers-timeout", "executors-tokio"] }

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }
# s3_attestation_live: computes the same CRC the client does, and PUTs a part
# directly at a presigned URL to check the provider's own validation.
crc-fast = "1.10"
base64 = "0.22"
reqwest = { workspace = true }
# reqwest uses `rustls-no-provider`, so a provider must be installed before any
# Client is built. RING, not aws-lc-rs: the workspace standardises on ring and
# pulling aws-lc in here would undo that deliberately.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[[test]]
name = "azure_azurite_tests"
required-features = ["azure"]

[[test]]
name = "reqsign_diag"
required-features = ["azure"]

[[test]]
name = "gcs_emulator_tests"
required-features = ["gcs"]

[[test]]
name = "gcs_integration_tests"
required-features = ["gcs"]

[[bench]]
name = "cache_bench"
harness = false

[package.metadata.cargo-machete]
ignored = []

[lints.rust]
unsafe_code = "deny"
