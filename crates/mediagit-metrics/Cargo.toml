[package]
name = "mediagit-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Prometheus metrics and performance monitoring for MediaGit"

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Prometheus metrics
prometheus = { workspace = true, features = ["process"] }

# HTTP server for metrics endpoint
axum = { workspace = true }

[dev-dependencies]
criterion.workspace = true
reqwest = { workspace = true }
# reqwest is built with `rustls-no-provider`, so anything constructing a Client
# must install a process-level provider first. The binaries do it in main();
# test binaries have no main() of ours, so they install it themselves.
# default-features = false keeps aws-lc-rs out of the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[[bench]]
name = "metrics_overhead"
harness = false
