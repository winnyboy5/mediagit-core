[package]
name = "mediagit-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Structured logging and observability for MediaGit"
# Not published to crates.io: distribution is cargo-dist binaries, Docker
# images and GitHub releases. This also makes deny.toml's
# `allow-wildcard-paths` apply to our own path deps (cargo-deny exempts
# them only for non-public crates). Flip to `true` and add `version = ...`
# beside every internal `path = ...` if crates.io publishing is turned on.
publish = false

[dependencies]
# Workspace dependencies
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt", "ansi", "time"] }

[dev-dependencies]
